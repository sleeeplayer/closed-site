<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <style>
        :root {
            color-scheme: light dark;

            --bg: #f5f5f5;
            --card: #ffffff;
            --text: #18191b;
            --muted: #73777d;
            --border: #e4e5e7;
            --button: #18191b;
            --button-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181a;
                --card: #202124;
                --text: #f1f1f1;
                --muted: #9a9da2;
                --border: #333538;
                --button: #f1f1f1;
                --button-text: #17181a;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 560px;
            text-align: center;
        }

        .card {
            padding: 44px 40px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .code {
            margin-bottom: 12px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 30px;
            line-height: 1.2;
            font-weight: 650;
            letter-spacing: -.6px;
        }

        .description {
            margin: 0 auto;
            max-width: 440px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .button {
            min-width: 190px;
            margin-top: 30px;
            padding: 12px 20px;
            border: 0;
            border-radius: 8px;
            background: var(--button);
            color: var(--button-text);
            font: inherit;
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            transition: opacity .15s ease, transform .1s ease;
        }

        .button:hover {
            opacity: .85;
        }

        .button:active {
            transform: scale(.98);
        }

        .footer {
            margin-top: 16px;

            color: var(--muted);

            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 36px 24px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="page">
        <section class="card">
            <div class="code">410 · GONE</div>
            <h1>Сайт закрыт</h1>
            <p class="description">Сайт был закрыт и переведён на парковочную страницу.</p>
            <button class="button" id="button" onclick="changeText()">А что если нажать?</button>
        </section>

        <footer class="footer">Made by spirit.rip with <3</footer>
    </main>

    <script>
        const button = document.getElementById("button");
        const originalText = "А что если нажать?";
        const texts = ["t.me/ezzvac", "spirit.rip"];

        let timeout;

        function changeText() {
            clearTimeout(timeout);
            const text = texts[Math.floor(Math.random() * texts.length)];
            button.textContent = text;
            timeout = setTimeout(() => { button.textContent = originalText; }, 2500);
        }
    </script>

</body>
</html>
